<title>Affiliate Boss | Refund Request</title>

<style>
  .ab-wrap {
    --ink: #141414;
    --body: #3a3a3a;
    --muted: #8a8a8a;
    --accent: #3b8df5;

    width: 100%;
    background: #ffffff;
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding: 20px 20px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .ab-wrap *, .ab-wrap *::before, .ab-wrap *::after { box-sizing: border-box; }

  .ab-col {
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .ab-logo {
    width: auto;
    height: 84px;
    display: block;
  }

  .ab-kicker {
    margin: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .ab-head {
    margin: 0;
    color: var(--ink);
    font-size: clamp(22px, 4.2vw, 30px);
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }

  #jc-refund-embed {
    width: 100%;
    position: relative;
    margin: 0;
  }
  #jc-refund-embed iframe {
    width: 100%;
    height: 400px;
    border: 0;
    display: block;
    transition: height .2s ease;
  }
  #jc-refund-skeleton {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 28px 24px;
    transition: opacity .3s;
  }
  @keyframes jcrsh { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  .jcrsk {
    background: #eef0f2 linear-gradient(90deg, #eef0f2 0, #f7f8f9 80px, #eef0f2 160px) 0 0/400px 100%;
    border-radius: 6px;
    animation: jcrsh 1.2s infinite linear;
  }

  .ab-note {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }
  .ab-note a { color: var(--accent); text-decoration: none; }
  .ab-note a:hover { text-decoration: underline; }
</style>

<div class="ab-wrap">
  <div class="ab-col">
    <img class="ab-logo" src="https://app.typeset.com/api/assets/6a671a4006cb041bac51f869/img-cw77Y7GSAG.png?w=750" alt="Affiliate Boss logo">

    <p class="ab-kicker">Affiliate Boss Support</p>
    <h1 class="ab-head">Affiliate Boss Refund Page</h1>

    <div id="jc-refund-embed">
      <iframe id="jc-refund-frame"
        src="https://jc-refund-486757944947.us-central1.run.app/widget"
        title="Refund request" scrolling="no"
        onload="var s=document.getElementById('jc-refund-skeleton');if(s){s.style.opacity='0';setTimeout(function(){s.style.display='none';},300);}"
        style="width:100%;height:400px;border:0;display:block;transition:height .2s ease;"></iframe>
      <div id="jc-refund-skeleton">
        <div class="jcrsk" style="height:24px;width:60%;margin:6px auto 16px;"></div>
        <div class="jcrsk" style="height:13px;width:88%;margin:0 auto 7px;"></div>
        <div class="jcrsk" style="height:13px;width:66%;margin:0 auto 26px;"></div>
        <div class="jcrsk" style="height:48px;width:100%;margin:0 auto 12px;border-radius:10px;"></div>
        <div class="jcrsk" style="height:48px;width:100%;margin:0 auto;border-radius:10px;"></div>
      </div>
    </div>

    <p class="ab-note">Questions about your refund? Email us at <a href="mailto:support@affiliateboss.com">support@affiliateboss.com</a> and we'll take it from there.</p>
  </div>
</div>

<script>
  (function () {
    var ORIGIN = "https://jc-refund-486757944947.us-central1.run.app";
    window.addEventListener("message", function (e) {
      if (e.origin !== ORIGIN) return;                       // only trust our widget
      var f = document.getElementById("jc-refund-frame");
      if (!f) return;
      if (e.data && e.data.type === "jcr-height" && typeof e.data.height === "number") {
        f.style.height = Math.max(120, Math.ceil(e.data.height)) + "px";
      } else if (e.data && e.data.type === "jcr-scroll") {
        f.scrollIntoView({ behavior: "smooth", block: "start" });   // keep current question in view
      }
    });
  })();
</script>
